name: Scheduled Tasks

on:
 schedule: 
   - cron: '30 2 * * 1'  
   - cron : '0 */6 *** ' 
 workflow_dispatch:

 jobs: 
   scheduled-job:
      runs-on: ubuntu-latest
      steps:
        - name: Print schelude Source
          run: |
            echo "Triggered by schedule : {{ github.event. schedule }}"

            - name: Health Check
              run: |
                response=$(s=0; curl-s -o /dev/null -w "%{http_code}" https://google.com)
                echo "Health check HTTP status :$response"
            
